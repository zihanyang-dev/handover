# One machine, running everything this deployment is made of.
#
# Not `compose.yml` at the root, which is a development file: that one exposes ports so a person
# can reach the database from their laptop, and carries passwords everybody already knows. Nothing
# here is reachable from outside except through Caddy.
#
# What the environment must hold is `.env.example` at the root of this repository, minus the two
# values decided here (`DATABASE_URL` and the object store's endpoint, which are names on this
# network rather than facts about the deployment).

name: handover

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: handover
      POSTGRES_DB: handover
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?the database password must be set}
    volumes: ['db-data:/var/lib/postgresql/data']
    # No `ports`. The only thing that talks to it is on this network, and a database on the public
    # internet is a database somebody else is talking to.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U handover -d handover']
      interval: 5s
      timeout: 3s
      retries: 30

  objects:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:?the object store key must be set}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:?the object store secret must be set}
    volumes: ['object-data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 30

  # Making the bucket is this deployment's job, not the server's: production credentials may be
  # allowed to read and write objects without being allowed to create buckets.
  #
  # A release step, for the same reason the migrations are one — and it used to be neither. Left
  # to `up`, it ran on every start, nothing read its exit code, and a `mc mb` that failed was a
  # bucket that did not exist with nobody saying so: the first word anybody got was an upload
  # failing days later. Behind a profile it does not start with everything else; `release.sh` asks
  # for it by name and stops if it fails.
  objects-ready:
    profiles: ['release']
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      objects:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set here http://objects:9000 "$$OBJECT_STORE_ACCESS_KEY" "$$OBJECT_STORE_SECRET_KEY" &&
        mc mb --ignore-existing here/"$$OBJECT_STORE_BUCKET"
    environment:
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:?}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:?}
      # No default here. `env.ts` refuses to invent one because a process that guessed a bucket
      # could write a valid object into the wrong deployment; inventing one here would put that
      # guess back, one layer down.
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?the bucket must be set}

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      objects: { condition: service_healthy }
    env_file: [.env]
    environment:
      # `sslmode=disable` because there is no wire to protect: this crosses a private compose
      # network on one host and never leaves it. Said out loud rather than left to a default —
      # dbmate requires TLS for any host that is not localhost, and without this the release step
      # spends a minute failing with "SSL is not enabled on the server".
      DATABASE_URL: postgres://handover:${POSTGRES_PASSWORD:?}@db:5432/handover?sslmode=disable
      OBJECT_STORE_ENDPOINT: http://objects:9000
      OBJECT_STORE_FORCE_PATH_STYLE: 'true'
      # Caddy is the one proxy in front of this, so the last entry in `X-Forwarded-For` is the one
      # Caddy wrote. `repository.md` calls this the only value that fails silently when it is
      # wrong: at 0, the per-caller letter limit can be reset by anybody who sets the header.
      TRUSTED_PROXY_HOPS: '1'
    # No `ports` either. Caddy reaches it by name; nothing else may.

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?the host name this deployment answers to must be set}

volumes:
  db-data:
  object-data:
  caddy-data:
  caddy-config:
