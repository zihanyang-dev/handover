packages:
  - apps/*
  - packages/*

# Both agent SDKs ship a full copy of their own agent as an optional dependency — 628 MB of
# binaries this machine already has and that are never loaded: every adapter points its SDK at the
# copy the person installed, which is the one holding their login.
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-*'
  - '@openai/codex-darwin-*'
  - '@openai/codex-linux-*'
  - '@openai/codex-win32-*'

# pnpm does not run install scripts unless a package is named here. Bun's is how its binary gets
# unpacked, so without this the build tool is present and unusable.
onlyBuiltDependencies:
  - bun
