name: handover

# One server, two databases. Which one a process talks to is decided by DATABASE_URL, so the
# test database is out of reach of anything pointed at the development one. `pnpm test:db`
# creates it on first run; nothing here has to know it exists.
#
# The port is deliberately not 5432. A development machine runs several projects at once, and
# whoever claims the conventional port makes every other checkout fail to start.
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: handover
      POSTGRES_PASSWORD: handover
      POSTGRES_DB: handover
    ports: ['5442:5432']
    volumes: ['db-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U handover -d handover']
      interval: 1s
      timeout: 3s
      retries: 60

  # The application speaks S3, not MinIO's own SDK. Replacing this with S3 or R2 therefore means
  # copying the bucket and changing environment values; no stored key or browser URL changes.
  objects:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: handover
      MINIO_ROOT_PASSWORD: handover-local-object-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['object-data:/data']
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:9000/minio/health/live']
      interval: 1s
      timeout: 3s
      retries: 60

  # Bucket creation belongs to the local deployment, not server startup. Production credentials
  # may rightly be able to read and write objects without being allowed to create buckets.
  objects-ready:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      objects:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://objects:9000 handover handover-local-object-secret &&
        mc mb --ignore-existing local/handover

volumes:
  db-data:
  object-data:
